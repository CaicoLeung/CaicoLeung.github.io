<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragonfly · 主 App 设计预览 v3</title>
<style id="css-core">
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{--font-body:"PingFang SC","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Microsoft YaHei",sans-serif}
body{background:var(--sh-bg);color:var(--sh-fg);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
body[data-mode=light]{--sh-bg:#E9E7E2;--sh-fg:#1C1C1E;--sh-line:#D6D3CC;--sh-card:#F6F4EF}
body[data-mode=dark]{--sh-bg:#0B0C0E;--sh-fg:#D7DADE;--sh-line:#26292E;--sh-card:#15171B}
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 20px;background:var(--sh-card);border-bottom:1px solid var(--sh-line)}
.bar h1{font-size:14px;font-weight:600;margin-right:6px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl label{font-size:12px;opacity:.6}
.rseg{display:inline-flex;padding:2px;border-radius:8px;background:var(--sh-line)}
.rseg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font:12px var(--font-body);color:var(--sh-fg);cursor:pointer}
.rseg button.on{background:var(--sh-card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.rbtn,.rselect{font:12px var(--font-body);color:var(--sh-fg);background:var(--sh-line);border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
.chk{font-size:12px;display:flex;align-items:center;gap:6px}
.rlink{font-size:12px;color:var(--sh-fg);opacity:.7}
.stage{display:flex;justify-content:center;padding:24px 16px 40px}
.wrap{position:relative}
.phone{width:390px;height:844px;padding:10px;border-radius:54px;background:#0b0b0c;box-shadow:0 0 0 2px #2a2a2e,0 30px 80px rgba(0,0,0,.35);transform-origin:top left}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);--tab-bg:var(--bg)}
.island{position:absolute;left:50%;top:11px;width:118px;height:33px;margin-left:-59px;border-radius:20px;background:#000;z-index:21}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 34px;font-size:15px;font-weight:600;pointer-events:none}
.sbar svg{width:18px;height:12px}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text);opacity:.9;z-index:22;pointer-events:none}
.viewport{position:absolute;inset:0;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding-bottom:100px;transition:transform .28s cubic-bezier(.32,.72,0,1);will-change:transform}
.page.enter{transform:translateX(100%)}
.page.under{transform:translateX(-28%)}
.page.under::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.09)}
.page.root{padding-top:50px}
.nav{position:sticky;top:0;z-index:5;display:flex;align-items:flex-end;justify-content:space-between;padding:50px 10px 8px;min-height:94px}
.page.collapsed .nav{background:var(--nav-bg);box-shadow:0 1px 0 var(--line)}
.nav .nt{position:absolute;left:60px;right:60px;bottom:12px;text-align:center;font-size:17px;font-weight:600;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page.collapsed .nt{opacity:1}
.back{display:flex;align-items:center;border:0;background:none;color:var(--primary);font:17px var(--font-body);cursor:pointer;padding:2px 4px}
.back svg{width:22px;height:22px}
.ltitle{padding:8px 20px 4px;font-family:var(--font-display);font-size:var(--fs-title);font-weight:var(--fw-title);letter-spacing:var(--tr-title);line-height:1.15}
.lsub{padding:0 20px;margin-top:4px;font-size:13px;color:var(--text-2);line-height:1.5}
.content{padding:0 16px}
.glabel{padding:22px 4px 8px;font-size:12px;color:var(--text-2);letter-spacing:.02em}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px}
.row+.row::before{content:'';position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.row.has-tile+.row.has-tile::before{left:58px}
.tappable{cursor:pointer}
.tappable:active{background:var(--press)}
.row-main{flex:1;min-width:0}
.row-title{font-size:var(--fs-body);font-weight:500;display:flex;align-items:center;gap:6px}
.row-cap{margin-top:2px;font-size:12px;line-height:1.45;color:var(--text-2)}
.row-trail{display:flex;align-items:center;gap:8px;flex:none}
.row-val{font-size:14px;color:var(--text-2);max-width:150px;text-align:right;white-space:nowrap}
.chev{width:16px;height:16px;color:var(--text-3)}
.lock-ic{width:13px;height:13px;color:var(--text-3)}
.tile{flex:none;width:30px;height:30px;border-radius:var(--r-tile);display:grid;place-items:center;background:hsl(var(--h) var(--tbs) var(--tbl));color:hsl(var(--h) var(--ts) var(--tl))}
.tile svg{width:18px;height:18px}
.tile.lg{width:40px;height:40px}
.tile.lg svg{width:22px;height:22px}
.tile.neutral{background:var(--card-2);color:var(--text-2)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.bcard{display:flex;flex-direction:column;gap:10px;min-height:118px;padding:14px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.bcard:active{transform:scale(.98)}
.bcard .t{margin-top:auto;font-size:16px;font-weight:600}
.bcard .c{font-size:12px;color:var(--text-2);line-height:1.4}
.tgl{position:relative;flex:none;width:50px;height:30px;border:0;border-radius:15px;background:var(--tgl-off);cursor:pointer;transition:background .18s}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .18s}
.tgl.on{background:var(--primary)}
.tgl.on::after{transform:translateX(20px)}
.seg{display:inline-flex;flex:none;padding:2px;border-radius:9px;background:var(--card-2)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font:13px var(--font-body);color:var(--text);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button[data-dev]{opacity:.4;pointer-events:none}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.dev .tgl,.dev .seg,.dev .secbtn{opacity:.4;pointer-events:none}
.pill{flex:none;padding:4px 7px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text-2);font-size:11px;line-height:1;white-space:nowrap}
.chip{flex:none;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}
.banner{display:flex;align-items:flex-start;gap:10px;margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--accent-soft);font-size:13px;line-height:1.45;color:var(--text)}
.banner.danger{background:color-mix(in srgb,var(--danger) 12%,var(--card));color:var(--danger)}
.banner .ic{flex:none;width:18px;height:18px;margin-top:1px;color:var(--accent)}
.banner.danger .ic{color:var(--danger)}
.banner .btxt{flex:1}
.banner .blink{margin-left:auto}
.blink{border:0;background:none;color:var(--accent);font:600 13px var(--font-body);white-space:nowrap;cursor:pointer}
.banner.danger .blink{color:var(--danger)}
.foot{padding:14px 24px 0;font-size:12px;line-height:1.55;color:var(--text-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;height:50px;border:0;border-radius:var(--r-btn);font:600 16px var(--font-body);cursor:pointer;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.secondary{background:var(--card-2);color:var(--text)}
.btn.text{height:44px;background:none;color:var(--text-2);font-weight:500;font-size:15px}
.btn.destructive{background:var(--card-2);color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}
.secbtn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--primary);color:var(--on-primary);font:600 15px var(--font-body);cursor:pointer;white-space:nowrap}
.secbtn.ghost{background:var(--card-2);color:var(--text)}
.layer{position:absolute;inset:0;z-index:40;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:82%;overflow:auto;padding:10px 20px 30px;border-radius:22px;background:var(--card);transform:translateY(110%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.layer.show{pointer-events:auto}
.layer.show .scrim{opacity:1}
.layer.show .sheet{transform:none}
.grab{width:36px;height:5px;margin:0 auto 14px;border-radius:3px;background:var(--line)}
.sheet h3{font-size:17px;font-weight:600;text-align:center}
.sheet .msg{margin:8px 0 16px;font-size:14px;line-height:1.5;color:var(--text-2);text-align:center;white-space:pre-line}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sheet .acts .btn{height:48px}
.acts .gap{height:6px}
.toast{position:absolute;top:64px;left:50%;z-index:45;max-width:330px;padding:10px 16px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13px;text-align:center;opacity:0;transform:translate(-50%,-12px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.cover{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);transition:transform .36s cubic-bezier(.32,.72,0,1)}
.cover.show{transform:none}
.cbody{flex:1;overflow-y:auto;padding:66px 20px 20px}
.cfoot{padding:12px 20px 46px;background:var(--bg);box-shadow:0 -1px 0 var(--line)}
.cfoot .btn+.btn{margin-top:6px}
.screen[data-theme=a]{--font-display:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;--font-num:var(--font-display);--fs-title:32px;--fw-title:600;--tr-title:0;--fs-body:15px;--lh-body:1.45;--r-card:18px;--r-tile:10px;--r-btn:14px;--ts:50%;--tl:38%;--tbs:42%;--tbl:94%;--shadow:0 1px 2px rgba(28,28,30,.05),0 6px 20px rgba(28,28,30,.05);--press:var(--card-2)}
.screen[data-theme=a][data-mode=light]{--bg:#F6F4EF;--card:#FFFFFF;--card-2:#EEECE6;--text:#1C1C1E;--text-2:#5E5E63;--text-3:#8E8E93;--line:#E6E3DC;--primary:#2E6460;--on-primary:#FFFFFF;--primary-soft:#E2EDEB;--accent:#B2452F;--accent-soft:#F6E3DE;--danger:#B3362A;--tgl-off:#D9D6CF;--nav-bg:#F6F4EF}
.screen[data-theme=a][data-mode=dark]{--bg:#121615;--card:#1B201F;--card-2:#242A29;--text:#ECEAE4;--text-2:#A9B1AE;--text-3:#7C8481;--line:#2A302F;--primary:#6FA79F;--on-primary:#0E1514;--primary-soft:#1D2E2B;--accent:#E07A5F;--accent-soft:#3A2622;--danger:#E5675A;--tgl-off:#3A4140;--nav-bg:#121615;--ts:45%;--tl:74%;--tbs:25%;--tbl:19%;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
.screen[data-theme=b]{--font-display:var(--font-body);--font-num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--fs-title:30px;--fw-title:700;--tr-title:-.02em;--fs-body:15px;--lh-body:1.45;--r-card:14px;--r-tile:8px;--r-btn:10px;--ts:70%;--tl:40%;--tbs:60%;--tbl:93%;--shadow:none;--press:var(--card-2)}
.screen[data-theme=b][data-mode=light]{--bg:#F2F3F5;--card:#FFFFFF;--card-2:#E8EAEE;--text:#14171C;--text-2:#5B6270;--text-3:#8A919B;--line:#E4E6EA;--primary:#1F2733;--on-primary:#FFFFFF;--primary-soft:#E3E6EB;--accent:#15866F;--accent-soft:#DDF3EE;--danger:#C0392B;--tgl-off:#D5D8DE;--nav-bg:#F2F3F5}
.screen[data-theme=b][data-mode=dark]{--bg:#0E1013;--card:#171A1F;--card-2:#1F2329;--text:#E8EAED;--text-2:#9CA3AC;--text-3:#6C737C;--line:#262A31;--primary:#F2F4F7;--on-primary:#0E1013;--primary-soft:#1F2329;--accent:#37C9AE;--accent-soft:#0F2E2A;--danger:#FF6B5B;--tgl-off:#2A2F36;--nav-bg:#0E1013;--ts:75%;--tl:66%;--tbs:40%;--tbl:18%}
.screen[data-theme=b] .card,.screen[data-theme=b] .bcard,.screen[data-theme=b] .sheet,.screen[data-theme=b] .opt,.screen[data-theme=b] .statbox,.screen[data-theme=b] .kcard{border:1px solid var(--line)}
.screen[data-theme=b] .phead{background-image:radial-gradient(var(--line) 1px,transparent 1.4px);background-size:11px 11px;background-position:12px 8px}
.screen[data-theme=c]{--font-display:var(--font-body);--font-num:var(--font-body);--fs-title:30px;--fw-title:600;--tr-title:0;--fs-body:16px;--lh-body:1.55;--r-card:22px;--r-tile:12px;--r-btn:16px;--ts:52%;--tl:40%;--tbs:55%;--tbl:92%;--shadow:0 2px 6px rgba(60,40,20,.06),0 10px 30px rgba(60,40,20,.06);--press:var(--card-2)}
.screen[data-theme=c][data-mode=light]{--bg:#FAF6EF;--card:#FFFFFF;--card-2:#F1EBE1;--text:#2B2622;--text-2:#6E655E;--text-3:#9C938A;--line:#ECE5DA;--primary:#A8552F;--on-primary:#FFFFFF;--primary-soft:#F5E6DE;--accent:#23756F;--accent-soft:#DDF0EE;--danger:#B5402C;--tgl-off:#DDD5CA;--nav-bg:#FAF6EF}
.screen[data-theme=c][data-mode=dark]{--bg:#1A1614;--card:#24201D;--card-2:#2E2926;--text:#F3EDE6;--text-2:#B0A49A;--text-3:#827870;--line:#332D29;--primary:#D9906A;--on-primary:#1A1210;--primary-soft:#3A2A22;--accent:#5BB3AC;--accent-soft:#1D3331;--danger:#E8775F;--tgl-off:#3E3833;--nav-bg:#1A1614;--ts:48%;--tl:74%;--tbs:30%;--tbl:20%}
.phead{padding-bottom:4px}
.kcard{margin:12px 16px 0;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.kcard .krow{display:flex;align-items:center;gap:10px;padding:13px 14px;font-size:13px;line-height:1.45;color:var(--text-2);cursor:pointer}
.kcard .krow .kdot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.kcard .krow.acc{color:var(--accent)}
.kcard .krow.acc .kdot{background:var(--accent)}
.kcard .krow.dgr{color:var(--danger)}
.kcard .krow.dgr .kdot{background:var(--danger)}
.kcard .krow .blink{margin-left:auto}
.kcard .krow svg.kic{width:18px;height:18px;flex:none}
.kcard .swline{padding:0 14px 10px;font-size:12px;color:var(--text-3)}
.kcard .swline b{font-weight:500;color:var(--text-2)}
.kcard .try{padding:0 14px 14px;display:none}
.kcard .try.show{display:block}
.kcard .fld{width:100%;min-height:40px;padding:9px 12px;border-radius:10px;background:var(--card-2);font-size:15px;color:var(--text-3);outline:none;font-family:inherit;border:0}
.kcard .fld.has{color:var(--text)}
.kcard .try.open .fld{min-height:72px}
.kcard .tryfoot{display:flex;align-items:center;margin-top:6px;font-size:12px;color:var(--text-3)}
.kcard .tryfoot .blink{margin-left:auto;font-weight:500;color:var(--text-2)}
@keyframes hover{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.5px) scale(1.05)}}
@keyframes rot{to{transform:rotate(360deg)}}
.wing-hover{animation:hover 1.6s ease-in-out infinite}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:rot 1s linear infinite;vertical-align:middle}
.job{padding:16px}
.jhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.jhead svg{width:22px;height:22px;color:var(--accent);flex:none}
.jt{font-size:16px;font-weight:600}
.js{margin-top:2px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.job.fail .jhead svg,.job.fail .jt{color:var(--danger)}
.job.fail .js{color:var(--danger)}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:flex-start;gap:10px;font-size:14px}
.step .dot{flex:none;width:20px;height:20px;margin-top:1px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--text-3);color:var(--text-3)}
.step .dot svg{width:12px;height:12px}
.step .dot .spin{width:12px;height:12px;border-width:1.5px}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.step.cur .dot{border-color:var(--accent)}
.step.fail .dot{border-color:var(--danger);color:var(--danger)}
.step.todo{color:var(--text-3)}
.hint{margin-top:2px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.pbar{height:6px;margin:8px 0 0 30px;border-radius:3px;background:var(--card-2)}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .2s linear}
details.sub{margin:10px 0 0 30px;font-size:12px}
details.sub summary{cursor:pointer;color:var(--text-2);list-style:none}
details.sub summary::-webkit-details-marker{display:none}
details.sub summary::before{content:'›';display:inline-block;margin-right:6px;transition:transform .15s}
details.sub[open] summary::before{transform:rotate(90deg)}
details.sub .substeps{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.substep{display:flex;align-items:center;gap:8px;color:var(--text-3)}
.substep svg{width:12px;height:12px;color:var(--accent)}
.substep.done,.substep.cur{color:var(--text)}
.substep .spin{width:11px;height:11px;border-width:1.5px}
.jacts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.jacts .btn{height:44px;font-size:15px}
.jacts.row{flex-direction:row}
.jacts.row .btn{flex:1}
.opt{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px;border-radius:18px;background:var(--card);border:1.5px solid transparent;box-shadow:var(--shadow);cursor:pointer}
.opt.on{border-color:var(--primary);background:var(--primary-soft)}
.opt .ot{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.opt .oc{margin-top:2px;font-size:12px;color:var(--text-2)}
.mini26{flex:none;width:118px;display:flex;flex-direction:column;gap:3px}
.mini26 .mr{display:flex;gap:3px;justify-content:center}
.mini26 .mk{height:15px;flex:1;border-radius:3px;background:var(--text);opacity:.8}
.mini26 .mk.fn{flex:.9;opacity:.3}
.mini26 .mk.sp{flex:4}
.mini9{flex:none;width:86px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mini9 .k9{height:23px;display:grid;place-items:center;border-radius:5px;background:var(--text);opacity:.8;color:var(--bg);font-size:9px;font-weight:600}
.ob-step{font-size:12px;color:var(--text-2);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.ob-title{margin-top:8px;font-family:var(--font-display);font-size:30px;font-weight:var(--fw-title);letter-spacing:var(--tr-title);line-height:1.15}
.ob-sub{margin:8px 0 4px;font-size:13px;color:var(--text-2);line-height:1.55}
.infocard{margin-top:14px;padding:14px 16px;border-radius:16px;background:var(--card-2);font-size:13px;line-height:1.65;color:var(--text-2)}
.infocard b{color:var(--text);font-weight:600}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:14px 16px;border-radius:14px;background:var(--card-2);font-size:13px;line-height:1.55;color:var(--text-2)}
.path b{font-weight:600;color:var(--text)}
.path .arw{color:var(--text-3)}
details.trouble{margin-top:12px;font-size:13px}

Object.assign(ACT,{faGeneral:()=>faSheet('完全访问'),delAll:()=>sheet({title:'删除全部数据',msg:'将删除所有已下载方案包、用户词典与设置，回到首次安装状态。',acts:[{l:'全部删除',k:'destructive',act:'delAllGo'},{gap:1,l:'取消',k:'secondary'}]}),delAllGo:()=>{dismissSheet();const {theme,mode,fa,kbAdded}=S;S=Object.assign(fresh(),{theme,mode,fa,kbAdded,onboarded:true});save();popAll();rerenderAll();toast('已删除全部数据')},markAdded:()=>markAdded()});
PAGES.storage={render(){const ins=inService();return nav('占用总览')+head('占用','解压后的词库与编译产物。')+content(card(Object.keys(PKG).filter(id=>S.pkgs[id].st!=='none').map(id=>row({title:PKG[id].name,value:'约 '+PKG[id].unzip+' MB',chip:S.pkgs[id].st==='inservice'})).join('')+(S.grammar.installed?row({title:'语法模型',value:'约 '+GRAMMAR.size+' MB'}):'')+row({title:'合计',value:'约 '+(Object.keys(PKG).filter(id=>S.pkgs[id].st!=='none').reduce((a,id)=>a+PKG[id].unzip,0)+(S.grammar.installed?GRAMMAR.size:0))+' MB'})))+foot('安装过程最多占用约 500–700 MB，装完即释放。')}};
PAGES.kbsetup={render(){return nav('启用与管理键盘')+head('启用与管理键盘',S.kbAdded?'蜻蜓已添加到系统键盘。':'还差这一步，才能在任何输入框里用蜻蜓打字。')+`<div style="padding:14px 16px 0"><div class="path"><b>1</b> 设置 <span class="arw">›</span> <b>2</b> 通用 <span class="arw">›</span> <b>3</b> 键盘 <span class="arw">›</span> 键盘 <span class="arw">›</span> <b>4</b> 添加新键盘… <span class="arw">›</span> <b>蜻蜓</b></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:14px"><button class="btn primary" data-act="openSettings">打开系统设置</button><button class="btn secondary" data-act="markAdded">我已添加键盘，试打一下</button></div><details class="trouble" style="padding:0 16px"><summary>看不到蜻蜓？</summary><div class="tb">· 添加后需要重启一次正在用的 App<br>· 确认点了「添加新键盘…」，并在第三方键盘区找到蜻蜓<br>· 在输入框长按地球键切换到蜻蜓<br>· 怎么切回系统键盘：长按地球键选系统拼音</div></details></div>`+foot('重装、换机、系统更新后都需要重新添加。')}};
PAGES.help={render(){const QA=[['没有中文候选？','按顺序检查：① 键盘是否已添加（上方「启用与管理键盘」）；② 是否装了方案包（键盘 Tab 横幅）；③ 是否切到了蜻蜓（长按地球键）。'],['装包失败怎么办？','看失败卡上的原因：空间不足就去清理或换雾凇拼音（约 47 MB）；下载中断会自动续传，不用手动重试。'],['「允许完全访问」是什么？','系统给键盘的一项权限。蜻蜓不开也能完整打字；开了才会保存学到的词、提供触感反馈与剪贴板历史。蜻蜓的键盘没有网络权限。'],['编译期间能切出去吗？','可以切到 App 内其他页面。切到别的 App 或锁屏会被系统中断，回来后自动续做；被系统杀掉后下次启动自动续做。'],['怎么切回系统键盘？','长按地球键，选系统拼音。'],['第二遍打同一个词还是排不到前面？','没开完全访问时，学到的词只在本次会话保留；开启后跨会话保存。']];return nav('帮助与自检')+head('帮助与自检','先看这里，再去反馈。')+content(card(QA.map(q=>`<div class="qa" data-act="qa"><div class="q">${q[0]}${svg('chev','chev')}</div><div class="a">${q[1]}</div></div>`).join('')))+foot('反馈问题时可附诊断包（不含输入内容）。')}};
PAGES.credits={render(){return nav('开源组件致谢')+head('开源组件致谢','随安装内容落地的许可全文可在「许可全文」查看。')+content(card([['librime','BSD-3-Clause'],['librime-lua','BSD-3-Clause'],['librime-octagram','BSD-3-Clause'],['KeyboardKit 7.8.0','MIT'],['OpenCC','Apache-2.0'],['雾凇拼音 rime-ice','GPL-3.0'],['万象拼音 rime-wanxiang','CC BY 4.0'],['语法模型 rime-wanxiang-data','CC BY 4.0']].map(c=>row({title:c[0],value:c[1]})).join('')))}};
applyChrome();fit();renderTabbar();
(function init(){const pending=Object.keys(S.pkgs).find(k=>S.pkgs[k].st==='pending');if(pending){S.pkgs[pending].st='none';beginInstall(pending,S.pkgs[pending].wantGrammar,false);toast('已恢复上次未完成的安装')}switchTab('keyboard');rerenderAll();const needCover=!S.onboarded||(!inService()&&!S.kbAdded&&(S.skipCount||0)<2&&!Object.keys(S.pkgs).some(k=>S.pkgs[k].fail));if(needCover)openCover(inService()?4:1)})();
</script>
</body>
</html>
