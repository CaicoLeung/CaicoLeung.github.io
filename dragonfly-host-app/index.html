<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragonfly · 主 App 设计预览</title>
<style id="css-core">
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{--font-body:"PingFang SC","Hiragino Sans GB",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Microsoft YaHei",sans-serif}
body{background:var(--sh-bg);color:var(--sh-fg);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
body[data-mode=light]{--sh-bg:#E9E7E2;--sh-fg:#1C1C1E;--sh-line:#D6D3CC;--sh-card:#F6F4EF}
body[data-mode=dark]{--sh-bg:#0B0C0E;--sh-fg:#D7DADE;--sh-line:#26292E;--sh-card:#15171B}
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 20px;background:var(--sh-card);border-bottom:1px solid var(--sh-line)}
.bar h1{font-size:14px;font-weight:600;margin-right:6px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl label{font-size:12px;opacity:.6}
.rseg{display:inline-flex;padding:2px;border-radius:8px;background:var(--sh-line)}
.rseg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font:12px var(--font-body);color:var(--sh-fg);cursor:pointer}
.rseg button.on{background:var(--sh-card);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.rbtn,.rselect{font:12px var(--font-body);color:var(--sh-fg);background:var(--sh-line);border:0;border-radius:6px;padding:5px 10px;cursor:pointer}
.chk{font-size:12px;display:flex;align-items:center;gap:6px}
.rlink{font-size:12px;color:var(--sh-fg);opacity:.7}
.stage{display:flex;justify-content:center;padding:24px 16px 40px}
.wrap{position:relative}
.phone{width:390px;height:844px;padding:10px;border-radius:54px;background:#0b0b0c;box-shadow:0 0 0 2px #2a2a2e,0 30px 80px rgba(0,0,0,.35);transform-origin:top left}
.screen{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body)}
.island{position:absolute;left:50%;top:11px;width:118px;height:33px;margin-left:-59px;border-radius:20px;background:#000;z-index:21}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 34px;font-size:15px;font-weight:600;pointer-events:none}
.sbar svg{width:18px;height:12px}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--text);opacity:.9;z-index:22;pointer-events:none}
.viewport{position:absolute;inset:0;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding-bottom:44px;transition:transform .28s cubic-bezier(.32,.72,0,1);will-change:transform}
.page.enter{transform:translateX(100%)}
.page.under{transform:translateX(-28%)}
.page.under::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.09)}
.page.home{padding-top:50px}
.nav{position:sticky;top:0;z-index:5;display:flex;align-items:flex-end;justify-content:space-between;padding:50px 10px 8px;min-height:94px}
.page.collapsed .nav{background:var(--nav-bg);box-shadow:0 1px 0 var(--line)}
.nav .nt{position:absolute;left:60px;right:60px;bottom:12px;text-align:center;font-size:17px;font-weight:600;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page.collapsed .nt{opacity:1}
.back{display:flex;align-items:center;border:0;background:none;color:var(--primary);font:17px var(--font-body);cursor:pointer;padding:2px 4px}
.back svg{width:22px;height:22px}
.ltitle{padding:8px 20px 4px;font-family:var(--font-display);font-size:var(--fs-title);font-weight:var(--fw-title);letter-spacing:var(--tr-title);line-height:1.15}
.lsub{padding:0 20px;margin-top:4px;font-size:13px;color:var(--text-2);line-height:1.5}
.content{padding:0 16px}
.glabel{padding:22px 4px 8px;font-size:12px;color:var(--text-2);letter-spacing:.02em}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px}
.row+.row::before{content:'';position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.row.has-tile+.row.has-tile::before{left:58px}
.tappable{cursor:pointer}
.tappable:active{background:var(--press)}
.row-main{flex:1;min-width:0}
.row-title{font-size:var(--fs-body);font-weight:500;display:flex;align-items:center;gap:6px}
.row-cap{margin-top:2px;font-size:12px;line-height:1.45;color:var(--text-2)}
.row-trail{display:flex;align-items:center;gap:8px;flex:none}
.row-val{font-size:14px;color:var(--text-2);max-width:150px;text-align:right;white-space:nowrap}
.chev{width:16px;height:16px;color:var(--text-3)}
.lock-ic{width:13px;height:13px;color:var(--text-3)}
.tile{flex:none;width:30px;height:30px;border-radius:var(--r-tile);display:grid;place-items:center;background:hsl(var(--h) var(--tbs) var(--tbl));color:hsl(var(--h) var(--ts) var(--tl))}
.tile svg{width:18px;height:18px}
.tile.lg{width:40px;height:40px}
.tile.lg svg{width:22px;height:22px}
.tile.neutral{background:var(--card-2);color:var(--text-2)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.bcard{display:flex;flex-direction:column;gap:10px;min-height:118px;padding:14px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.bcard:active{transform:scale(.98)}
.bcard .t{margin-top:auto;font-size:16px;font-weight:600}
.bcard .c{font-size:12px;color:var(--text-2);line-height:1.4}
.tgl{position:relative;flex:none;width:50px;height:30px;border:0;border-radius:15px;background:var(--tgl-off);cursor:pointer;transition:background .18s}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .18s}
.tgl.on{background:var(--primary)}
.tgl.on::after{transform:translateX(20px)}
.seg{display:inline-flex;flex:none;padding:2px;border-radius:9px;background:var(--card-2)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font:13px var(--font-body);color:var(--text);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.dev .tgl,.dev .seg{opacity:.4;pointer-events:none}
.pill{flex:none;padding:4px 7px;border-radius:999px;border:1px solid var(--pill-br);background:var(--pill-bg);color:var(--pill-fg);font-size:11px;line-height:1;white-space:nowrap}
.chip{flex:none;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600}
.banner{display:flex;align-items:flex-start;gap:10px;margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--accent-soft);font-size:13px;line-height:1.45}
.banner.dev{background:var(--card-2);color:var(--text-2)}
.banner .ic{flex:none;width:18px;height:18px;margin-top:1px;color:var(--accent)}
.banner.dev .ic{color:var(--text-2)}
.banner .btxt{flex:1}
.blink{border:0;background:none;color:var(--accent);font:600 13px var(--font-body);white-space:nowrap;cursor:pointer}
.foot{padding:14px 24px 0;font-size:12px;line-height:1.55;color:var(--text-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;height:50px;border:0;border-radius:var(--r-btn);font:600 16px var(--font-body);cursor:pointer;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.secondary{background:var(--card-2);color:var(--text)}
.btn.text{height:44px;background:none;color:var(--text-2);font-weight:500;font-size:15px}
.btn.destructive{background:var(--card-2);color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}
.layer{position:absolute;inset:0;z-index:40;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:82%;overflow:auto;padding:10px 20px 30px;border-radius:22px;background:var(--card);transform:translateY(110%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.layer.show{pointer-events:auto}
.layer.show .scrim{opacity:1}
.layer.show .sheet{transform:none}
.grab{width:36px;height:5px;margin:0 auto 14px;border-radius:3px;background:var(--line)}
.sheet h3{font-size:17px;font-weight:600;text-align:center}
.sheet .msg{margin:8px 0 16px;font-size:14px;line-height:1.5;color:var(--text-2);text-align:center;white-space:pre-line}
.sheet .acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sheet .acts .btn{height:48px}
.acts .gap{height:6px}
.toast{position:absolute;top:64px;left:50%;z-index:45;max-width:330px;padding:10px 16px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13px;text-align:center;opacity:0;transform:translate(-50%,-12px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.cover{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;background:var(--bg);transform:translateY(100%);transition:transform .36s cubic-bezier(.32,.72,0,1)}
.cover.show{transform:none}
.cbody{flex:1;overflow-y:auto;padding:66px 20px 20px}
.cfoot{padding:12px 20px 46px;background:var(--bg);box-shadow:0 -1px 0 var(--line)}
.screen[data-theme=a]{--font-display:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;--font-num:var(--font-display);--fs-title:32px;--fw-title:600;--tr-title:0;--fs-body:15px;--lh-body:1.45;--r-card:18px;--r-tile:10px;--r-btn:14px;--ts:50%;--tl:38%;--tbs:42%;--tbl:94%;--pill-br:var(--line);--pill-fg:var(--text-2);--pill-bg:transparent;--shadow:0 1px 2px rgba(28,28,30,.05),0 6px 20px rgba(28,28,30,.05);--press:var(--card-2)}
.screen[data-theme=a][data-mode=light]{--bg:#F6F4EF;--card:#FFFFFF;--card-2:#EEECE6;--text:#1C1C1E;--text-2:#6B6B70;--text-3:#A3A3A8;--line:#E6E3DC;--primary:#2E6460;--on-primary:#FFFFFF;--primary-soft:#E2EDEB;--accent:#C8503A;--accent-soft:#F6E3DE;--danger:#B3362A;--tgl-off:#D9D6CF;--nav-bg:#F6F4EF}
.screen[data-theme=a][data-mode=dark]{--bg:#121615;--card:#1B201F;--card-2:#242A29;--text:#ECEAE4;--text-2:#9AA29F;--text-3:#666E6B;--line:#2A302F;--primary:#6FA79F;--on-primary:#0E1514;--primary-soft:#1D2E2B;--accent:#E07A5F;--accent-soft:#3A2622;--danger:#E5675A;--tgl-off:#3A4140;--nav-bg:#121615;--ts:45%;--tl:74%;--tbs:25%;--tbl:19%;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}
.screen[data-theme=b]{--font-display:var(--font-body);--font-num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;--fs-title:30px;--fw-title:700;--tr-title:-.02em;--fs-body:15px;--lh-body:1.45;--r-card:14px;--r-tile:8px;--r-btn:10px;--ts:70%;--tl:40%;--tbs:60%;--tbl:93%;--pill-br:transparent;--pill-fg:var(--accent);--pill-bg:var(--accent-soft);--shadow:none;--press:var(--card-2)}
.screen[data-theme=b][data-mode=light]{--bg:#F2F3F5;--card:#FFFFFF;--card-2:#E8EAEE;--text:#14171C;--text-2:#6B7280;--text-3:#9AA0AA;--line:#E4E6EA;--primary:#1F2733;--on-primary:#FFFFFF;--primary-soft:#E3E6EB;--accent:#1A9C84;--accent-soft:#DDF3EE;--danger:#C0392B;--tgl-off:#D5D8DE;--nav-bg:#F2F3F5}
.screen[data-theme=b][data-mode=dark]{--bg:#0E1013;--card:#171A1F;--card-2:#1F2329;--text:#E8EAED;--text-2:#8A9099;--text-3:#5C626B;--line:#262A31;--primary:#F2F4F7;--on-primary:#0E1013;--primary-soft:#1F2329;--accent:#37C9AE;--accent-soft:#0F2E2A;--danger:#FF6B5B;--tgl-off:#2A2F36;--nav-bg:#0E1013;--ts:75%;--tl:66%;--tbs:40%;--tbl:18%}
.screen[data-theme=b] .card,.screen[data-theme=b] .bcard,.screen[data-theme=b] .sheet,.screen[data-theme=b] .opt,.screen[data-theme=b] .statbox{border:1px solid var(--line)}
.screen[data-theme=b] .phead{background-image:radial-gradient(var(--line) 1px,transparent 1.4px);background-size:11px 11px;background-position:12px 8px}

.screen[data-theme=c][data-mode=light]{--bg:#FAF6EF;--card:#FFFFFF;--card-2:#F1EBE1;--text:#2B2622;--text-2:#7A716A;--text-3:#A89F96;--line:#ECE5DA;--primary:#A8552F;--on-primary:#FFFFFF;--primary-soft:#F5E6DE;--accent:#2E8C86;--accent-soft:#DDF0EE;--danger:#B5402C;--tgl-off:#DDD5CA;--nav-bg:#FAF6EF}
.screen[data-theme=c][data-mode=dark]{--bg:#1A1614;--card:#24201D;--card-2:#2E2926;--text:#F3EDE6;--text-2:#A69A90;--text-3:#766C64;--line:#332D29;--primary:#D9906A;--on-primary:#1A1210;--primary-soft:#3A2A22;--accent:#5BB3AC;--accent-soft:#1D3331;--danger:#E8775F;--tgl-off:#3E3833;--nav-bg:#1A1614;--ts:48%;--tl:74%;--tbs:30%;--tbl:20%}
.phead{padding-bottom:4px}
.status{display:flex;align-items:center;gap:8px;margin:8px 20px 0;font-size:13px;color:var(--text-2)}
.status.jobstat{color:var(--accent);cursor:pointer}
.status svg{width:18px;height:18px;flex:none}
.status.warn{margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--text);cursor:pointer}
.status.warn .blink{margin-left:auto}
.trycard{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:14px 16px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);cursor:pointer}
.trycard .tt{font-size:15px;font-weight:600}
.trycard .tc{margin-top:2px;font-size:12px;color:var(--text-2)}
.trycard .fld{flex:1;min-height:36px;padding:8px 12px;border-radius:10px;background:var(--card-2);font-size:15px;color:var(--text-3);outline:none}
.trycard .fld.has{color:var(--text)}
.trycard.open{flex-direction:column;align-items:stretch;cursor:default}
.trycard.open .fld{min-height:72px}
.trycard .hint{margin-top:6px;font-size:12px;color:var(--text-3)}
@keyframes hover{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.5px) scale(1.05)}}
@keyframes rot{to{transform:rotate(360deg)}}
.wing-hover{animation:hover 1.6s ease-in-out infinite}
.spin{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:rot 1s linear infinite;vertical-align:middle}
@media (prefers-reduced-motion:reduce){.wing-hover,.spin{animation:none}.page,.cover,.sheet,.toast{transition:none}}
.job{padding:16px}
.jhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.jhead svg{width:22px;height:22px;color:var(--accent);flex:none}
.jt{font-size:16px;font-weight:600}
.js{margin-top:2px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column;gap:10px}

.step.cur .dot{border-color:var(--accent)}

 if(!JOB){stopTick();return}
 const now=Date.now();JOB.elapsed=now-JOB.startedAt;

 const isDeploy=(JOB.kind==='install'&&JOB.phase>=5)||(JOB.kind==='compile'&&JOB.phase>=1);
 if(isDeploy){JOB.cancellable=false;if(!JOB.subStart)JOB.subStart=now;let acc=0,i=0;for(;i<SUBDUR.length;i++){acc+=SUBDUR[i];if(now-JOB.subStart<acc)break}JOB.sub=Math.min(i,SUBDUR.length);if(now-JOB.subStart>=SUBDUR.reduce((a,b)=>a+b,0)){JOB.sub=SUBDUR.length;finishJob();return}refreshJob();return}
 if(JOB.phase===1&&durs[1]>0){JOB.progress=Math.min(1,t/durs[1]);if(S.scenario==='drop'&&JOB.progress>=0.62){failJob('下载中断：网络连接中断。已清理，未占用空间。');return}}

 if(d>0&&t>=d){JOB.phase++;JOB.phaseStart=now;JOB.progress=0;if(JOB.phase>=PHASES[JOB.kind].length){finishJob();return}}
 refreshJob();
}

 return nav('按键与手势')+head('按键与手势','手感与手势。带锁标的项需要系统授予「允许完全访问」。')+content(glabel('按键')+card(row({title:'按键触感反馈',lock:!S.fa,cap:faCap,control:seg(HAPTIC,S.haptic,'haptic')})+row({title:'按键音',value:'关',dev:true,act:'dev',arg:'按键音'})))+content(glabel(S.layout==='26'?'手势 · 二十六键':'手势 · 通用')+card(row({title:'手势预设',value:'默认预设',dev:true,act:'dev',arg:'手势预设'})+(S.layout==='26'?row({title:'上划输入符号',value:'开',dev:true,act:'dev',arg:'上划输入符号'})+row({title:'长按字母变音',value:'关',dev:true,act:'dev',arg:'长按字母变音'}):'')+row({title:'双指触摸板光标',value:'开',dev:true,act:'dev',arg:'双指触摸板光标'})+row({title:'Shift 双击锁定',value:'开',dev:true,act:'dev',arg:'Shift 双击锁定'})))+foot('当前手势：长按空格移动光标 · 长按回车换行 · 候选栏左滑滚动、右侧展开 · ⌫ 上滑整词删除 · 候选区次选 / 三选滑动上屏');

ACT.push=el=>{const [p,a]=el.dataset.arg.split(':');push(p,a)};
function pkgRows(){
 let h='';for(const id of Object.keys(PKG)){const st=S.pkgs[id],pk=PKG[id];
  if(st.st==='inservice'){const d=st.since?sinceDays(st.since):42;h+=`<div class="row tappable has-tile" data-act="push" data-arg="detail:${id}">${tile('scheme',1)}<div class="row-main"><div class="row-title">${pk.name} ${chip()}</div><div class="row-cap">${st.ver||pk.ver} · 在役第 ${d} 天</div></div><div class="row-trail"><span class="row-val">${typeName(id,S.types[id])}</span>${svg('chev','chev')}</div></div>`}
  else{const cap=st.fail?`失败：${esc(st.fail)}`:st.st==='installed'?`已下载 · ${st.ver||pk.ver} · 点按切换使用（秒级，不重编译）`:`未下载 · 约 ${sizeText(id,true)} · ${pk.license} · 点按安装并在役`;h+=row({tile:'scheme',title:pk.name,cap,value:st.st==='installed'?'已下载':'',act:JOB?null:'pkgTap',arg:id,chev:!JOB})}}
 return h;
}
PAGES.scheme={render(){
 const ins=inService(),busy=!!JOB;
 let h=nav('输入方案')+head('输入方案','同一时刻只有一个包在役。已下载的包秒级切回，不重编译。');
 if(JOB)h+=`<div style="margin:14px 16px 0">${jobHTML()}</div>`;
 h+=content(glabel('方案包')+card(pkgRows()));
 if(ins)h+=content(glabel('输入类型')+card(PKG[ins].types.map(t=>row({title:t.n,cap:t.id===S.types[ins]?(PKG[ins].instant?'当前使用。切换即时生效，打下一个词就用新方案':'当前使用。切换需重新编译词库，约 2–5 分钟，期间键盘只能打英文'):undefined,radio:t.id===S.types[ins],act:busy||t.id===S.types[ins]?null:'typeTap',arg:t.id}).replace('data-act="typeTap"',`data-act="typeTap" data-pkg="${ins}"`)).join('')));
 const g=S.grammar,gState=g.check==='checking'?'检查中…':g.installed?'已装':'未装';
 const gBtn=g.installed?`<button class="btn secondary" style="width:auto;height:34px;padding:0 12px;font-size:13px" data-act="grammarAction" data-arg="check">检查</button>`:`<button class="btn primary" style="width:auto;height:34px;padding:0 12px;font-size:13px" data-act="grammarAction" data-arg="dl">下载</button>`;
 h+=content(glabel('语法')+card(row({title:'语法模型',cap:'万象 LTS 语法模型 '+GRAMMAR.ver+' · 约 '+GRAMMAR.size+'，建议 Wi-Fi；不装不影响打字',value:gState,control:gBtn})+(g.installed?row({title:'语法排序',cap:'按上下文搭配重排候选。下次键盘唤起生效，无需重新部署',control:tog(g.on,'grammar.on')}):'')+(g.installed?row({title:'删除语法模型',act:'grammarAction',arg:'del',value:'~'+GRAMMAR.size}):'')));
 h+=content(glabel('更多')+card((ins==='wanxiang'?row({title:'辅助码',value:'开',dev:true,act:'dev',arg:'辅助码'}):'')+row({title:'模糊音',value:'全关',dev:true,act:'dev',arg:'模糊音'})+row({title:'简繁切换',value:'简体',dev:true,act:'dev',arg:'简繁切换'})+row({title:'联想词',value:'开',dev:true,act:'dev',arg:'联想词'})+row({title:'自定义方案包导入',cap:'暂不支持 yaml / lua 导入',dev:true,act:'dev',arg:'自定义方案包导入'})));
 return h+foot('已下载的其他包保留在设备上，旧版本只在新版下载成功后清除。下载后设备端编译（分钟级）期间键盘英文直通。键盘内输入 /zrm 之类的切换指令不会生效，请在 App 内切换。');
}};
PAGES.detail={render(arg){
 const id=(arg||'').split(':')[1]||'rime-ice',st=S.pkgs[id],pk=PKG[id];
 const status=st.st==='inservice'?'在役 · '+(st.ver||pk.ver):st.st==='installed'?'已下载 · '+(st.ver||pk.ver):st.fail?'失败：'+esc(st.fail):'未下载';
 const manage=JOB?row({title:'安装进行中',value:'回上一页看步骤'}):st.st!=='none'?row({title:'检查版本',act:'checkUpdate',arg:id,value:st.check==='checking'?'检查中…':''}):row({title:'下载并使用',act:'pkgTap',arg:id,value:sizeText(id,true)});
 return nav(pk.name)+head(pk.name,pk.desc)+content(glabel('状态')+card(row({title:'包',value:pk.src})+row({title:'状态',value:status})+row({title:'许可',value:pk.license})+row({title:st.st==='none'?'安装峰值预检':'占用',value:st.st==='none'?'约 '+pk.peak+' MB':'下载 '+pk.size+' · 解压 '+pk.unzip})))+content(glabel('管理')+card(manage+(pk.grammar?row({title:'随包安装语法模型',cap:'~'+GRAMMAR.size+'，建议 Wi-Fi；不装不影响打字',control:tog(S.grammar.on,'grammar.on')}):'')+row({title:'查看许可全文',act:'push',arg:'license:'+id,chev:true})))+foot(st.fail?esc(st.fail):'装好后回到「输入方案」点该包即可秒级切换使用。旧版本只在新版下载成功后清除。');
}};

PAGES.candidates={render(){return nav('候选栏')+head('候选栏','拼音串显示在哪里、一屏几个候选。')+content(glabel('组码显示')+card(row({title:'在输入框内显示拼音',cap:'开启时拼音串直接显示在输入框内，同系统键盘；关闭或密码框时显示在候选栏。组码清空后的下一词起生效。',control:tog(S.inline,'inline')})))+content(glabel('候选')+card(row({title:'候选数量',value:'4',dev:true,act:'dev',arg:'候选数量'})+row({title:'还原全拼显示',value:'关',dev:true,act:'dev',arg:'还原全拼显示'})))+foot('候选栏右侧展开完整候选面板，展开后可连续滚动、懒拉窗口。')}};

 return nav('外观')+head('外观','键盘的键帽配色。主 App 当前跟随系统深色模式。')+content(glabel('主 App')+card(row({title:'主 App 深色模式',value:'跟随系统',dev:true,act:'dev',arg:'主 App 深色模式'})))+content(glabel('键盘')+card(row({title:'键盘主题',value:'素白',dev:true,act:'dev',arg:'键盘主题'})+`<div class="swatches">${sw.map((s,i)=>`<div class="swatch"><div class="kb" style="--sw-bg:${s[1]};--sw-k:${s[2]}"><i></i><i></i><i style="flex:3"></i></div><div class="sl">${s[0]}${i===0?' · 当前':''}</div></div>`).join('')}</div>`))+foot('键盘主题开发中，预计随 V1.1 提供。');

PAGES.clipboard={render(){return nav('剪贴板')+head('剪贴板','复制过的文字与常用短语，只存本机。')+`<div class="banner dev">${svg('info','ic')}<div class="btxt">剪贴板开发中 · 当前版本不读取剪贴板。以下为完成后的样子。</div></div>`+content(glabel('剪贴板')+card(row({title:'剪贴板历史',lock:true,cap:'需允许完全访问。iOS 只允许开了完全访问的键盘读取剪贴板。内容只存本机，退出即清',value:'关',dev:true,act:'dev',arg:'剪贴板历史'})+row({title:'常用短语',cap:'在主 App 里编辑，键盘只读，不需要完全访问',value:'空',dev:true,act:'dev',arg:'常用短语'})))+`<div class="empty" style="margin:0 16px">${svg('clip')}<div class="et">还没有内容</div><div>开启剪贴板历史后，复制过的文字会出现在这里。</div><button class="btn secondary" data-act="dev" data-arg="常用短语">添加常用短语</button></div>`+foot('剪贴板内容不会离开设备。')}};
PAGES.stats={render(){
 const bars=[38,52,44,61,58,70,64,77,72,85,80,92];
 return nav('统计')+head('统计','只在本机记录，不上传。')+`<div class="banner dev">${svg('info','ic')}<div class="btxt">输入统计开发中 · 当前版本不记录任何数据。以下是完成后的样子。</div></div><div class="card bignum" style="margin:12px 16px 0"><div class="v">1,284</div><div class="l">今日字数 · 在役第 42 天</div></div><div class="statgrid" style="margin-top:12px"><div class="statbox"><div class="v">7,930</div><div class="l">本周字数</div></div><div class="statbox"><div class="v">48,210</div><div class="l">累计字数</div></div><div class="statbox"><div class="v">87%</div><div class="l">首选命中率 · 第一候选就是想要的词</div></div><div class="statbox"><div class="v">12</div><div class="l">连续使用周数</div></div></div><div class="card" style="margin:12px 16px 0;padding:14px 16px"><div class="row-cap" style="margin:0">近 12 周字数</div><div class="chart">${bars.map(b=>`<i style="height:${b}%"></i>`).join('')}</div></div><div class="milestone" style="margin-top:12px">距离累计 5 万字还差 1,790 字。</div>`+content(glabel('设置')+card(row({title:'输入统计',value:'关',dev:true,act:'dev',arg:'输入统计'})+row({title:'清除统计数据',dev:true,act:'dev',arg:'清除统计数据'})))+foot('统计只存本机，不上传，不用于推荐。关闭后删除已有记录。');

PAGES.privacy={render(){return nav('数据与隐私')+head('数据与隐私','引擎离线，键盘无网络，输入内容不上传。')+content(glabel('系统授权')+card(row({title:'允许完全访问',cap:S.fa?'已开启。触感反馈与持久化可用':'只解锁触感反馈与以后的持久化。不开也能完整打字',value:S.fa?'已开启':'未开启',act:'faTap',chev:true})))+content(glabel('用户词')+card(row({title:'用户词',cap:'仅本次打字会话有效。未开启完全访问时，自造词与词频不跨会话保留',value:'会话级'})+row({title:'用户词持久化',lock:true,cap:'开启后自造词跨会话保留',value:'关',dev:true,act:'dev',arg:'用户词持久化'})+row({title:'iCloud 同步',lock:true,cap:'同步用户词与设置，不同步统计',value:'关',dev:true,act:'dev',arg:'iCloud 同步'})))+content(glabel('数据')+card(row({title:'删除已下载的方案包',cap:'删除后可随时重新下载；在役包需先切换',dev:true,act:'dev',arg:'删除已下载的方案包'})+row({title:'自定义配置导入',cap:'暂不支持 yaml / lua 导入',dev:true,act:'dev',arg:'自定义配置导入'})+row({title:'隐私说明',act:'push',arg:'privacyNote',chev:true})))+foot('无需账户，无分析 SDK。')}};

PAGES.about={render(){const ins=inService();return nav('关于')+`<div class="aboutlogo">${svg('wing')}<div class="an">蜻蜓</div><div class="av">1.0 (0) · iOS 第三方中文 Rime 输入法</div></div>`+content(card(row({title:'版本',value:'1.0 (0)'})+row({title:'引擎',value:'librime · 进程内 · 离线'})+row({title:'在役包',value:ins?PKG[ins].name+(S.pkgs[ins].ver?' · '+S.pkgs[ins].ver:''):'未安装',act:ins?'push':null,arg:ins?'detail:'+ins:undefined,chev:!!ins})+row({title:'方案包许可全文',act:'push',arg:'license:'+(ins||'rime-ice'),chev:true})+row({title:'开源组件致谢',cap:'librime、语法插件、rime-ice、万象拼音、语法模型',dev:true,act:'dev',arg:'开源组件致谢'})+row({title:'反馈问题',cap:'GitHub Issues',dev:true,act:'dev',arg:'反馈问题'})+row({title:'重看首启引导',cap:'重新走一遍布局选择与推荐配置，不影响已装内容',dev:true,act:'dev',arg:'重看首启引导'})))+foot('词库不随 App 提供，按需下载。')}};
applyChrome();fit();push('home');if(!S.onboarded)openCover();
